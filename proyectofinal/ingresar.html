<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingresar</title>
  <link rel="stylesheet" href="estilo/2.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    .fondo-animado {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .fila {
      display: flex;
      width: 200%;
      position: absolute;
      opacity: 0.35;
    }

    .fila img {
      width: 200px;
      height: 150px;
      object-fit: cover;
      margin: 0 5px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }

    .fila1 { top: 10%; animation: moverIzquierda 30s linear infinite; }
    .fila2 { top: 45%; animation: moverDerecha 30s linear infinite; }
    .fila3 { top: 80%; animation: moverIzquierda 30s linear infinite; }

    @keyframes moverIzquierda {
      0% { transform: translateX(0); }
      100% { transform: translateX(-60%); }
    }

    @keyframes moverDerecha {
      0% { transform: translateX(-60%); }
      100% { transform: translateX(0); }
    }

    .contenedor {
      background-color: rgba(255, 251, 0, 0.85);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      position: relative;
    }

    .contenedor img {
      width: 100px;
      margin-bottom: 20px;
    }

    .volver {
      margin-top: 20px;
      background-color: #ccc;
      color: #333;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .volver:hover {
      background-color: #999;
    }

    form .input-span {
      margin-bottom: 15px;
      width: 100%;
    }

    form .input-span label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    form .input-span input {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    form .submit {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }

    form .submit:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  
  <div class="fondo-animado">
    <div class="fila fila1">
      <img src="IR/1.jpg" />
      <img src="IR/16.jpg" />
      <img src="IR/2.jpg" />
      <img src="IR/3.jpg" />
      <img src="IR/11.jpg" />
      <img src="IR/19.jpg" />
    </div>
    <div class="fila fila2">
      <img src="IR/17.jpg" />
      <img src="IR/3.jpg" />
      <img src="IR/1.jpg" />
      <img src="IR/10.jpg" />
      <img src="IR/12.jpg" />
      <img src="IR/15.jpg" />
    </div>
    <div class="fila fila3">
      <img src="IR/7.jpg" />
      <img src="IR/4.jpg" />
      <img src="IR/6.jpg" />
      <img src="IR/4.jpg" />
      <img src="IR/9.jpg" />
      <img src="IR/20.jpg" />
    </div>
  </div>

  
  <div class="contenedor">
    <img src="imagenes/firecatY.jpg" alt="Logo" />
    <form class="form" id="loginForm">
      <span class="input-span">
        <label for="email" class="label">Email</label>
        <input type="email" name="email" id="email" required />
      </span>

      <span class="input-span">
        <label for="password" class="label">Password</label>
        <input type="password" name="password" id="password" required />
      </span>

      <input class="submit" type="submit" value="Log in" />
    </form>
    <button class="volver" onclick="window.location.href='login.html'">Volver</button>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = email.value.trim();
      const password = password.value.trim();
      const usuarioID = email.replace(/[@.]/g, "_");

      const res = await fetch(`/usuarios/${usuarioID}/data.json`);
      if (!res.ok) return alert("Usuario no existe");

      const data = await res.json();
      if (data.password !== password) return alert("Contraseña incorrecta");

      window.location.href = `principal.html?usuario=${usuarioID}`;
    });
  </script>
</body>
</html>
