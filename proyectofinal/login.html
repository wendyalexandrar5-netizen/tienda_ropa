<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bienvenida</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Fondo animado */
    .fondo-animado {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .fila {
      display: flex;
      width: 200%;
      position: absolute;
      opacity: 0.35; /* Más visible */
    }

    .fila img {
      width: 200px;
      height: 150px;
      object-fit: cover;
      margin: 0 5px;
    }

    .fila1 { top: 10%; animation: moverIzquierda 30s linear infinite; }
    .fila2 { top: 45%; animation: moverDerecha 30s linear infinite; }
    .fila3 { top: 80%; animation: moverIzquierda 30s linear infinite; }
    
    @keyframes moverIzquierda {
      0% { transform: translateX(0); }
      100% { transform: translateX(-60%); }
    }

    @keyframes moverDerecha {
      0% { transform: translateX(-60%); }
      100% { transform: translateX(0); }
    }

    /* Contenido principal */
    .contenedor {
      position: relative;
      z-index: 1;
      background-color: rgba(255, 251, 0, 0.85); /* Fondo amarillo más transparente */
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
      margin: auto;
      top: 50%;
      transform: translateY(-50%);
    }

    .contenedor img {
      width: 100px;
      height: auto;
      margin-bottom: 15px;
    }

    .titulo {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }

    .descripcion {
      font-size: 16px;
      color: #444;
      margin-bottom: 20px;
    }

    .botones button {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      transition: background-color 0.3s ease;
    }

    .botones button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  
  <div class="fondo-animado">
    <div class="fila fila1">
      <img src="IR/1.jpg" />
      <img src="IR/4.jpg" />
      <img src="IR/7.jpg" />
      <img src="IR/5.jpg" />
      <img src="IR/14.jpg" />
      <img src="IR/19.jpg" />
    </div>
    <div class="fila fila2">
      <img src="IR/20.jpg" />
      <img src="IR/11.jpg" />
      <img src="IR/2.jpg" />
      <img src="IR/9.jpg" />
      <img src="IR/17.jpg" />
      <img src="IR/15.jpg" />
    </div>
    <div class="fila fila3">
      <img src="IR/10.jpg" />
      <img src="IR/16.jpg" />
      <img src="IR/8.jpg" />
      <img src="IR/14.jpg" />
      <img src="IR/1.jpg" />
      <img src="IR/2.jpg" />
    </div>
    


  <div class="contenedor">
    <img src="imagenes/firecatY.jpg" alt="Logo" />
    <div class="titulo">¡Bienvenido!</div>
    <div class="descripcion">la mejor calidad en venta de ropa y textiles</div>
    <div class="botones">
      <button onclick="window.location.href='ingresar.html'">Ingresar</button>
      <button onclick="window.location.href='registrar.html'">Registrarse</button>
    </div>
  </div>

</body>
</html>
