<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Caja - Resumen de Ganancias</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .dia {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .venta {
      border-top: 1px solid #ccc;
      padding: 10px 0;
    }

    .venta:first-of-type {
      border-top: none;
    }

    .ganancia-dia {
      font-weight: bold;
      color: green;
      margin-top: 10px;
    }

    .volver {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #888;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Resumen de Caja</h1>

  <div id="contenedor-ganancias"></div>

  <button class="volver" onclick="window.location.href='Principal.html'">Volver</button>

  <script>
    const ventas = JSON.parse(localStorage.getItem('ventas')) || [];

    // Agrupar ventas por fecha
    const ventasPorFecha = {};
    ventas.forEach(v => {
      const fecha = v.fecha || 'Sin fecha';
      if (!ventasPorFecha[fecha]) {
        ventasPorFecha[fecha] = [];
      }
      ventasPorFecha[fecha].push(v);
    });

    const contenedor = document.getElementById('contenedor-ganancias');

    if (Object.keys(ventasPorFecha).length === 0) {
      contenedor.innerHTML = "<p>No hay ventas registradas.</p>";
    } else {
      for (const fecha in ventasPorFecha) {
        const ventasDia = ventasPorFecha[fecha];
        let totalDia = 0;

        const divDia = document.createElement('div');
        divDia.className = 'dia';
        divDia.innerHTML = `<h3>🗓️ Fecha: ${fecha}</h3>`;

        ventasDia.forEach((venta, i) => {
          totalDia += venta.total;
          const ventaDiv = document.createElement('div');
          ventaDiv.className = 'venta';
          ventaDiv.innerHTML = `
            <p><strong>Venta #${i + 1}</strong> - Total: $${venta.total} | Pago: $${venta.pago} | Cambio: $${venta.cambio}</p>
          `;
          divDia.appendChild(ventaDiv);
        });

        const ganancia = document.createElement('div');
        ganancia.className = 'ganancia-dia';
        ganancia.textContent = `💰 Total ganado el día: $${totalDia}`;
        divDia.appendChild(ganancia);

        contenedor.appendChild(divDia);
      }
    }
  </script>

</body>
</html>
