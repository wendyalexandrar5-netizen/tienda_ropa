<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registrarse</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Fondo animado */
    .fondo-animado {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .fila {
      display: flex;
      width: 200%;
      position: absolute;
    }

    .fila img {
      width: 250px;
      margin: 0 10px;
      border-radius: 10px;
      opacity: 0.7;
    }

    .fila1 { top: 10%; animation: moverIzquierda 30s linear infinite; }
    .fila2 { top: 45%; animation: moverDerecha 30s linear infinite; }
    .fila3 { top: 80%; animation: moverIzquierda 30s linear infinite; }

    @keyframes moverIzquierda {
      0% { transform: translateX(0); }
      100% { transform: translateX(-60%); }
    }

    @keyframes moverDerecha {
      0% { transform: translateX(0); }
      100% { transform: translateX(60%); }
    }

    /* Contenedor del formulario */
    .contenedor {
      background-color: rgba(255, 251, 0, 0.95);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .contenedor img {
      width: 90px;
      margin-bottom: 20px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 320px;
    }

    .input-group {
      display: flex;
      gap: 1rem;
      width: 100%;
    }

    .input-span {
      width: 45%;
    }

    .form input[type="text"],
    .form input[type="email"],
    .form input[type="password"] {
      border-radius: 0.5rem;
      padding: 0.8rem 1rem;
      width: 100%;
      border: none;
      background-color: #efefef;
      outline: 2px solid #707070;
      font-size: 1rem;
    }

    .form input:focus {
      outline: 2px solid #58bc82;
    }

    .label {
      align-self: flex-start;
      color: #58bc82;
      font-weight: 600;
    }

    .submit {
      padding: 0.8rem 1rem;
      width: 100%;
      border-radius: 3rem;
      background-color: #707070;
      color: #efefef;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 300ms;
    }

    .submit:hover {
      background-color: #58bc82;
      color: #707070;
    }

    .volver {
      margin-top: 20px;
      background-color: #ccc;
      color: #333;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .volver:hover {
      background-color: #999;
    }
  </style>
</head>
<body>


  <div class="fondo-animado">
    <div class="fila fila1">
      <img src="IR/10.jpg" />
      <img src="IR/11.jpg" />
      <img src="IR/12.jpg" />
      <img src="IR/13.jpg" />
      <img src="IR/14.jpg" />
    </div>
    <div class="fila fila2">
      <img src="IR/15.jpg" />
      <img src="IR/16.jpg" />
      <img src="IR/17.jpg" />
      <img src="IR/18.jpg" />
      <img src="IR/19.jpg" />
    </div>
    <div class="fila fila3">
      <img src="IR/1.jpg" />
      <img src="IR/2.jpg" />
      <img src="IR/3.jpg" />
      <img src="IR/4.jpg" />
      <img src="IR/5.jpg" />
    </div>
  </div>

 
   <div class="contenedor">
    <img src="imagenes/firecatY.jpg" alt="Logo" />
    <form class="form" id="registroForm">
      <div class="input-group">
        <span class="input-span">
          <label for="nombre" class="label">Nombre</label>
          <input type="text" name="nombre" id="nombre" required />
        </span>
        <span class="input-span">
          <label for="apellido" class="label">Apellido</label>
          <input type="text" name="apellido" id="apellido" required />
        </span>
      </div>

      <span class="input-span" style="width: 100%;">
        <label for="correo" class="label">Correo</label>
        <input type="email" name="correo" id="correo" required />
      </span>

      <span class="input-span" style="width: 100%;">
        <label for="password" class="label">Contraseña</label>
        <input type="password" name="password" id="password" required />
      </span>

      <input class="submit" type="submit" value="Registrarse" />
    </form>

    <button class="volver" onclick="window.location.href='login.html'">Volver</button>
  </div>

  <script>
    document.getElementById("registroForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const nombre = nombre.value.trim();
      const apellido = apellido.value.trim();
      const correo = correo.value.trim();
      const password = password.value.trim();
      const usuarioID = correo.replace(/[@.]/g, "_");

      const data = { nombre, apellido, correo, password, productos: [] };

      const res = await fetch(`/usuarios/${usuarioID}/data.json`);
      if (res.ok) {
        alert("El usuario ya existe.");
        return;
      }

      await fetch(`/crearUsuario.php`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: usuarioID, data })
      });

      alert("Usuario registrado exitosamente");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
