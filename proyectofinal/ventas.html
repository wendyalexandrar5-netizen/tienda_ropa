<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de Ventas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .venta {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .venta-producto {
      margin-left: 20px;
      padding: 5px 0;
    }

    .volver {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #888;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-pdf {
      margin-top: 10px;
      background-color: #4CAF50;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Historial de Ventas</h1>

  <div id="lista-ventas"></div>

  <button class="volver" onclick="window.location.href='carrito.html'">Volver</button>

  <!-- Librería html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    const ventas = JSON.parse(localStorage.getItem('ventas')) || [];
    const contenedor = document.getElementById('lista-ventas');

    if (ventas.length === 0) {
      contenedor.innerHTML = "<p>No hay ventas registradas.</p>";
    } else {
      ventas.forEach((venta, index) => {
        const div = document.createElement('div');
        div.className = 'venta';
        div.id = `venta-${index}`;

        const productosHTML = venta.productos.map(p => `
          <div class="venta-producto">
            <strong>ID:</strong> ${p.id} |
            <strong>Cantidad:</strong> ${p.cantidad} |
            <strong>Talla:</strong> ${p.talla} |
            <strong>Color:</strong> ${p.color} |
            <strong>Subtotal:</strong> $${p.precio * p.cantidad}
          </div>
        `).join('');

        const fechaVenta = venta.fecha ? new Date(venta.fecha).toLocaleString() : 'Fecha no registrada';

        div.innerHTML = `
          <h3>Venta #${index + 1}</h3>
          <p><strong>Fecha:</strong> ${fechaVenta}</p>
          ${productosHTML}
          <p><strong>Total:</strong> $${venta.total}</p>
          <p><strong>Pago recibido:</strong> $${venta.pago}</p>
          <p><strong>Cambio entregado:</strong> $${venta.cambio}</p>
          <button class="btn-pdf" onclick="descargarPDF(${index})">Descargar PDF</button>
        `;

        contenedor.appendChild(div);
      });
    }

    function descargarPDF(index) {
      const elemento = document.getElementById(`venta-${index}`);
      const opciones = {
        margin: 0.5,
        filename: `venta_${index + 1}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opciones).from(elemento).save();
    }
  </script>

</body>
</html>
