<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-volver {
      background-color: #888;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .acciones {
      display: flex;
      gap: 10px;
    }

    .btn-agregar,
    .btn-editar-general,
    .btn-eliminar-general {
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-agregar {
      background-color: #4CAF50;
    }

    .btn-editar-general {
      background-color: #2196F3;
    }

    .btn-eliminar-general {
      background-color: #f44336;
    }

    .producto {
      border: 1px solid #ccc;
      padding: 15px;
      margin: 10px 0;
      background-color: white;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .producto img {
      width: 100px;
      height: 100px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <header>
    <!-- Botón Volver a la izquierda -->
    <button class="btn-volver" onclick="window.location.href='principal.html'">Volver</button>

    <!-- Botones de acción a la derecha -->
    <div class="acciones">
      <button class="btn-agregar" onclick="window.location.href='agregar.html'">Agregar producto</button>
      <button class="btn-editar-general" onclick="editar()">Editar</button>
      <button class="btn-eliminar-general" onclick="eliminar()">Eliminar</button>
    </div>
  </header>

  <div id="lista-productos"></div>

  <script>
    const productos = JSON.parse(localStorage.getItem('productos')) || [];

    window.onload = function () {
      const contenedor = document.getElementById('lista-productos');
      contenedor.innerHTML = "";

      productos.forEach(p => {
        const div = document.createElement('div');
        div.className = 'producto';
        div.innerHTML = `
          <img src="${p.imagen}" alt="Producto">
          <div>
            <p><strong>ID:</strong> ${p.id}</p>
            <p><strong>Cantidad:</strong> ${p.cantidad}</p>
            <p><strong>Talla:</strong> ${p.talla}</p>
            <p><strong>Color:</strong> ${p.color}</p>
            <p><strong>Precio:</strong> $${p.precio}</p>
          </div>
        `;
        contenedor.appendChild(div);
      });
    };

    function editar() {
      // Redirige a la página de edición
      window.location.href = "editar.html";
    }

    function eliminar() {
      // Redirige a la página de eliminación
      window.location.href = "eliminar.html";
    }
  </script>

</body>
</html>
